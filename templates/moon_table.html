{{define "moon_table.html"}}
<p>Local times for {{.Location.Name}} ({{.Location.TZ}}); daylight saving is applied automatically.</p>
<table class="table table-hover table-bordered table-striped table-condensed">
	<thead>
		<tr>
			<th>Date</th>
			<th>Zone</th>
			<th>Moon Rise</th>
			<th>Moon Set</th>
		</tr>
	</thead>
	<tbody>
		{{range .Days}}
		<tr>
			<td>{{.Weekday}} {{.Date}}</td>
			<td>{{.Zone}}</td>
			<td class="numeric">{{.Rise}}</td>
			<td class="numeric">{{.Set}}</td>
		</tr>
		{{end}}
	</tbody>
</table>
{{end}}
